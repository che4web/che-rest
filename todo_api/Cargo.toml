[package]
name = "todo_api"
version = "0.1.0"
edition = "2024"
default-run = "todo_api"

[features]
default = ["sqlite"]
sqlite = []

[dependencies]
axum = "0.8"
che-rest = { version = "0.1.0", path = "../../che-rest" }
che-orm = { version = "0.1.0", path = "../../che-orm" }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync"] }
