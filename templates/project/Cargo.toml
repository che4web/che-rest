[package]
name = "{{project-name}}"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
default-run = "{{project-name}}"

[dependencies]
axum = "0.8"
che-orm = { version = "0.3.0"{% if che_orm_path != "" %}, path = "{{che_orm_path}}"{% endif %} }
che-rest = { version = "0.3.0"{% if che_rest_path != "" %}, path = "{{che_rest_path}}"{% endif %} }
serde = { version = "1", features = ["derive"] }
time = "0.3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync"] }
