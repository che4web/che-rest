[package]
name = "che-rest"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
argon2 = "0.5"
clap = { version = "4", features = ["derive"] }
che-orm2 = { path = "../che-orm2" }
hex = "0.4"
futures-util = "0.3"
rand = "0.8"
refinery = { version = "0.9.2", default-features = false, features = ["rusqlite", "int8-versions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
sha2 = "0.10"
time = "0.3"
toml = "0.8"
