[package]
name = "che-rest"
version = "0.1.0"
edition = "2024"
description = "Typed REST framework and project tooling for che-orm applications"
license = "MIT"
repository = "https://github.com/che4web/che-rest"
homepage = "https://github.com/che4web/che-rest"
documentation = "https://docs.rs/che-rest"
rust-version = "1.85"
keywords = ["rest", "api", "orm", "sqlite"]
categories = ["web-programming", "database"]
exclude = ["benchmarks/**"]

[dependencies]
axum = { version = "0.8", features = ["ws"] }
argon2 = "0.5"
clap = { version = "4", features = ["derive"] }
che-orm = { version = "0.2.0", path = "../che-orm" }
hex = "0.4"
futures-util = "0.3"
rand = "0.8"
refinery = { version = "0.9.2", default-features = false, features = ["rusqlite", "int8-versions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
sha2 = "0.10"
time = "0.3"
toml = "0.8"
