[package]
name = "che-rest"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
che-orm2 = { path = "../../che-orm2" }
che-orm2-rest = { path = "../../che-orm2/che-orm2-rest" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
toml = "0.8"
