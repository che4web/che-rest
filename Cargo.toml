[package]
name = "che-rest"
version = "0.3.3"
edition = "2024"
description = "Typed REST framework and project tooling for che-orm applications"
license = "MIT"
repository = "https://github.com/che4web/che-rest"
homepage = "https://github.com/che4web/che-rest"
documentation = "https://docs.rs/che-rest"
rust-version = "1.88"
keywords = ["rest", "api", "orm", "sqlite"]
categories = ["web-programming", "database"]
exclude = ["benchmarks/**", "my-project/**"]

[features]
default = []
sync-http = ["dep:reqwest"]
push = ["dep:reqwest", "dep:jsonwebtoken", "tokio/time"]

[dependencies]
axum = { version = "0.8", features = ["ws", "multipart"] }
image = { version = "=0.25.5", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
jsonwebtoken = { version = "9.3", optional = true }
argon2 = "0.5"
clap = { version = "4", features = ["derive"] }
che-orm = { version = "0.3.3", path = "../che-orm" }
che-sync = { version = "0.1.1", path = "../che-orm/che-sync" }
hex = "0.4"
futures-util = "0.3"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
sha2 = "0.10"
time = "0.3"
toml = "0.8"
reqwest = { version = "0.12", optional = true, default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[[example]]
name = "model_sync"
required-features = ["sync-http"]
