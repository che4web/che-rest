[package]
name = "che-rest"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
che-orm = { path = "../che-orm/crates/che-orm" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.150"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
toml = "0.8"
