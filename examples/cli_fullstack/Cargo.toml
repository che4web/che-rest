[package]
name = "cli_fullstack"
version = "0.1.0"
edition = "2024"
default-run = "cli_fullstack"

[features]
default = ["sqlite"]
sqlite = []

[dependencies]
axum = "0.8"
che-orm = { version = "0.1.0", path = "../../../che-orm" }
che-rest = { version = "0.1.0", path = "../.." }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
time = "0.3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync"] }

[dev-dependencies]
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies"] }
tokio-tungstenite = "0.29"
